syntax = "proto3";

import "google/protobuf/descriptor.proto";

package sdc.options;

option go_package = "github.com/sdcio/sdc-protos/sdcpb;sdcpb";

// Numbers 51300 to 51399 are reserved here and are never reused for another
// option. Next free: 51303.

extend google.protobuf.MessageOptions {
  // Marks every field of the message as a secret, including fields added later.
  // A field opts out with secret_field = false.
  optional bool secret = 51301;
}

extend google.protobuf.FieldOptions {
  // Marks or exempts a single field, wins over secret on the enclosing message.
  optional bool secret_field = 51302;
}
